<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Track-Experiment – Motorisches Lernen</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px); }
body { font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 1rem 1.2rem; }
h1 { font-size: 18px; font-weight: 500; margin-bottom: 0.3rem; }
p.sub { font-size: 13px; color: #aaa; margin-bottom: 0.8rem; line-height: 1.5; max-width: 700px; }
#round-label { font-size: 13px; color: #888; text-align: center; margin-bottom: 0.4rem; }
#track-wrap { width: 100%; max-width: 720px; border-radius: 10px; border: 1px solid #333; overflow: hidden; background: #1a1a2e; cursor: none; touch-action: none; user-select: none; }
canvas#track { display: block; width: 100%; }
#stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 0.8rem 0; max-width: 720px; }
.stat { background: #1e1e1e; border-radius: 8px; padding: 0.6rem 0.8rem; border: 1px solid #333; }
.stat-label { font-size: 11px; color: #888; margin-bottom: 3px; }
.stat-value { font-size: 20px; font-weight: 500; }
#chart-wrap { background: #1e1e1e; border: 1px solid #333; border-radius: 10px; padding: 0.8rem; margin-bottom: 0.8rem; max-width: 720px; }
canvas#lc { display: block; width: 100%; height: 130px; }
#settings { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-width: 720px; margin-bottom: 0.75rem; }
.setting-row { display: flex; align-items: center; gap: 8px; background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 0.5rem 0.7rem; }
.setting-row label { font-size: 11px; color: #aaa; flex: 1; }
.setting-row input[type=range] { width: 70px; }
.setting-val { font-size: 13px; font-weight: 500; color: #378ADD; min-width: 22px; text-align: right; }
#controls { display: flex; gap: 8px; max-width: 720px; margin-bottom: 0.6rem; }
button { flex: 1; padding: 9px 14px; border-radius: 8px; border: 1px solid #555; background: #222; color: #eee; font-size: 13px; cursor: pointer; }
button:hover { background: #333; }
#reset-btn { max-width: 180px; }
#msg { font-size: 13px; color: #888; text-align: center; min-height: 20px; }
</style>
</head>
<body>
<h1>Track-Experiment</h1>
<p class="sub">Der Punkt fährt automatisch von links nach rechts. Steuere ihn mit Maus oder Finger hoch und runter – bleibe auf den Plattformen.</p>
<div id="round-label">Serie — / —  |  Versuch — / —</div>
<div id="track-wrap"><canvas id="track"></canvas></div>

<div id="chart-wrap"><canvas id="lc"></canvas></div>
<div id="table-wrap" style="display:none;max-width:720px;margin-bottom:0.8rem;">
  <table id="series-table" style="width:100%;border-collapse:collapse;font-size:13px;">
    <thead>
      <tr style="background:#2a2a4a;color:#aaa;">
        <th style="padding:6px 10px;text-align:left;border:1px solid #333;">Serie</th>
        <th style="padding:6px 10px;text-align:center;border:1px solid #333;">Mittelwert</th>
        <th style="padding:6px 10px;text-align:center;border:1px solid #333;">Bestwert</th>
      </tr>
    </thead>
    <tbody id="series-tbody"></tbody>
  </table>
</div>
<div id="settings" ontouchstart="event.stopPropagation()">
  <div class="setting-row"><label>Geschwindigkeit (Level)</label><input type="range" id="speed-slider" min="1" max="5" step="1" value="2"><span class="setting-val" id="speed-val">2</span></div>
  <div class="setting-row"><label>Wiederholungen pro Serie</label><input type="range" id="reps-slider" min="2" max="20" step="1" value="12"><span class="setting-val" id="reps-val">12</span></div>
  <div class="setting-row"><label>Anzahl Serien</label><input type="range" id="series-slider" min="1" max="8" step="1" value="6"><span class="setting-val" id="series-val">6</span></div>
  <div class="setting-row"><label>Pause zwischen Versuchen (s)</label><input type="range" id="delay-slider" min="1" max="5" step="1" value="3"><span class="setting-val" id="delay-val">3</span></div>
  <div class="setting-row"><label>Serienpause (s)</label><input type="range" id="series-delay-slider" min="5" max="60" step="5" value="30"><span class="setting-val" id="series-delay-val">30</span></div>
  <div class="setting-row" style="grid-column:1/-1;">
    <label>Steuerung</label>
    <div style="display:flex;gap:8px;flex:1;">
      <button id="btn-mouse" onclick="setMode('mouse')" style="flex:1;padding:6px;font-size:12px;border-color:#378ADD;color:#378ADD;background:#1a2a3a;">Maus / Trackpad</button>
      <button id="btn-touch" onclick="setMode('touch')" style="flex:1;padding:6px;font-size:12px;">Touchscreen</button>
    </div>
  </div>
</div>
<div id="controls">
  <button id="reset-btn" onclick="resetExp()">Zurücksetzen</button>
</div>
<div id="msg">Tippe auf den Spielbereich oder drücke Leertaste um zu starten.</div>

<script>
const CW=720, CH=300, H=20;
const WARMUP_REPS=3;
const PLATFORMS=[
  [0,130,160],[130,240,40],[240,340,260],[340,440,190],
  [440,530,30],[530,640,220],[640,730,170],[730,840,280],
  [840,940,110],[940,1040,80]
];
// Simple warmup track: mostly flat with one small jump
const WARMUP_PLATFORMS=[
  [0,340,150],[340,660,210],[660,1040,100]
];
const PATH_END=1040;
function REPS(){return parseInt(document.getElementById('reps-slider').value);}
function SERIES(){return parseInt(document.getElementById('series-slider').value);}
function SPEED(){return parseInt(document.getElementById('speed-slider').value)*0.13;}
function DELAY(){return parseInt(document.getElementById('delay-slider').value);}
function SERIES_DELAY(){return parseInt(document.getElementById('series-delay-slider').value);}
[['speed-slider','speed-val'],['reps-slider','reps-val'],['series-slider','series-val'],
 ['delay-slider','delay-val'],['series-delay-slider','series-delay-val']].forEach(([id,vid])=>{
  document.getElementById(id).addEventListener('input',e=>{document.getElementById(vid).textContent=e.target.value;});
});
let cv,ctx,state='idle',controlMode='mouse';
let isWarmup=true,warmupRep=0;
let currentSeries=0,currentRep=0,allScores=[],seriesScores=[];
let animId=null,countdownId=null;
let mouseY=CH/2,mouseAbsY=0,dotX=0;
let onTrackFrames=0,totalFrames=0,lastTs=null,finished=false,trail=[],mouseInCanvas=false;

function activePlatforms(){return isWarmup?WARMUP_PLATFORMS:PLATFORMS;}
function isOnPlatform(x,y){for(const p of activePlatforms())if(x>=p[0]&&x<=p[1]&&Math.abs(y-p[2])<=H)return true;return false;}
function sx(x){return x*CW/PATH_END;}
function init(){
  cv=document.getElementById('track');cv.width=CW;cv.height=CH;ctx=cv.getContext('2d');
  mouseY=activePlatforms()[0][2];drawScene(0,mouseY,false,'start');drawChart();
}
function drawPlatforms(){
  const plats=activePlatforms();
  plats.forEach((p,i)=>{
    const x0=sx(p[0]),x1=sx(p[1]),yc=p[2];
    ctx.fillStyle='#2a2a5a';ctx.strokeStyle='#5555aa';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.rect(x0,yc-H,x1-x0,H*2);ctx.fill();ctx.stroke();
    ctx.strokeStyle='#4444aa';ctx.lineWidth=1;ctx.setLineDash([5,6]);
    ctx.beginPath();ctx.moveTo(x0,yc);ctx.lineTo(x1,yc);ctx.stroke();ctx.setLineDash([]);

  });
  const s=plats[0];
  ctx.fillStyle='#1D9E75';ctx.beginPath();ctx.arc(sx(s[0])+10,s[2],9,0,2*Math.PI);ctx.fill();
  ctx.fillStyle='white';ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('S',sx(s[0])+10,s[2]);
  const e=plats[plats.length-1];
  ctx.fillStyle='#E24B4A';ctx.beginPath();ctx.arc(sx(e[1])-10,e[2],9,0,2*Math.PI);ctx.fill();
  ctx.fillStyle='white';ctx.fillText('Z',sx(e[1])-10,e[2]);
  // Warmup label
  if(isWarmup){
    ctx.fillStyle='#888';ctx.font='12px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillText('Eingewöhnung – Versuch '+warmupRep+' / '+WARMUP_REPS,10,8);
  }
}
function drawScene(dx,dy,on,overlay,countdownN,feedbackPct,isSeriesPause){
  ctx.clearRect(0,0,CW,CH);ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,CW,CH);
  drawPlatforms();
  if(state==='running'){
    // Main dot: blue when on track, red when off
    ctx.beginPath();ctx.fillStyle=on?'#378ADD':'#E24B4A';
    ctx.arc(sx(dx),dy,7,0,2*Math.PI);ctx.fill();
    ctx.strokeStyle='white';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(sx(dx),dy,7,0,2*Math.PI);ctx.stroke();
  } else if(state!=='done'&&controlMode==='mouse'&&mouseInCanvas){
    // Green cursor dot at start X, following mouse Y
    const p0=activePlatforms()[0];
    const startX=sx(p0[0])+10;
    const r=cv.getBoundingClientRect();
    const cursorY=Math.max(5,Math.min(CH-5,(mouseAbsY-r.top)*CH/r.height));
    ctx.beginPath();ctx.fillStyle='#1D9E75';
    ctx.arc(startX,cursorY,7,0,2*Math.PI);ctx.fill();
    ctx.strokeStyle='white';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.arc(startX,cursorY,7,0,2*Math.PI);ctx.stroke();
  }
  if(overlay==='start'){
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,CW,CH);
    ctx.fillStyle='white';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('Tippen oder Leertaste → Start',CW/2,CH/2);
  }
  if(overlay==='countdown'&&countdownN!==undefined){
    // Blink first platform
    const p0=activePlatforms()[0];
    const blink=Math.floor(Date.now()/400)%2===0;
    ctx.fillStyle=blink?'rgba(55,138,221,0.35)':'rgba(55,138,221,0.1)';
    ctx.strokeStyle='#378ADD'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.rect(sx(p0[0]),p0[2]-H,sx(p0[1])-sx(p0[0]),H*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,CW,CH);
    ctx.fillStyle='white';ctx.font='bold 36px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(countdownN,CW/2,CH/2-28);
    ctx.font='14px sans-serif';ctx.fillStyle='#bbb';
    ctx.fillText(isSeriesPause?'Serienpause – gleich weiter...':'Nächster Versuch startet...',CW/2,CH/2+8);
    ctx.font='12px sans-serif';ctx.fillStyle='#378ADD';
    const hint=controlMode==='touch'?'→ Finger zur Startposition bringen':'→ Maus zur Startposition bringen';
    ctx.fillText(hint,CW/2,CH/2+32);
  }
  if(overlay==='feedback'&&feedbackPct!==undefined){
    if(trail.length>1){
      ctx.beginPath();ctx.strokeStyle='rgba(255,200,50,0.75)';ctx.lineWidth=2;
      trail.forEach((pt,i)=>{i===0?ctx.moveTo(sx(pt[0]),pt[1]):ctx.lineTo(sx(pt[0]),pt[1]);});ctx.stroke();
    }
    ctx.fillStyle='rgba(0,0,0,0.62)';ctx.beginPath();
    ctx.roundRect(CW/2-130,CH/2-38,260,76,10);ctx.fill();
    ctx.strokeStyle='#5555aa';ctx.lineWidth=1;ctx.beginPath();
    ctx.roundRect(CW/2-130,CH/2-38,260,76,10);ctx.stroke();
    ctx.fillStyle='white';ctx.font='bold 26px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(feedbackPct+'% auf Pfad',CW/2,CH/2-8);
    ctx.font='12px sans-serif';ctx.fillStyle='#aaa';
    const lbl=isWarmup?'Eingewöhnung '+warmupRep+' / '+WARMUP_REPS:'Serie '+currentSeries+' | Versuch '+currentRep;
    ctx.fillText(lbl,CW/2,CH/2+20);
  }
}
function loop(ts){
  if(state!=='running'||finished)return;
  if(lastTs===null)lastTs=ts;
  const dt=ts-lastTs;lastTs=ts;
  dotX+=SPEED()*dt;
  if(dotX>=PATH_END-10){dotX=PATH_END-10;finishRound();return;}
  totalFrames++;
  const on=isOnPlatform(dotX,mouseY);
  if(on)onTrackFrames++;
  trail.push([dotX,mouseY]);
  drawScene(dotX,mouseY,on,null);
  animId=requestAnimationFrame(loop);
}
function updateLabel(){
  if(isWarmup){
    document.getElementById('round-label').textContent='Eingewöhnung – Versuch '+warmupRep+' / '+WARMUP_REPS;
  } else {
    document.getElementById('round-label').textContent='Serie '+currentSeries+' / '+SERIES()+'  |  Versuch '+currentRep+' / '+REPS();
  }
}
function finishRound(){
  finished=true;cancelAnimationFrame(animId);
  document.body.style.cursor='default';
  const pct=totalFrames>0?Math.round(onTrackFrames/totalFrames*100):0;
  if(!isWarmup){allScores.push(pct);seriesScores.push(pct);}
  drawChart();
  drawScene(dotX,mouseY,false,'feedback',null,pct);
  setTimeout(()=>{
    if(isWarmup){
      if(warmupRep>=WARMUP_REPS){
        // Warmup done – show transition message
        isWarmup=false;
        ctx.clearRect(0,0,CW,CH);ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,CW,CH);
        ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,CW,CH);
        ctx.fillStyle='#1D9E75';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('Eingewöhnung abgeschlossen!',CW/2,CH/2-20);
        ctx.fillStyle='white';ctx.font='14px sans-serif';
        ctx.fillText('Jetzt startet das echte Experiment.',CW/2,CH/2+10);
        document.getElementById('msg').textContent='Gleich startet das echte Experiment – Parcours einprägen!';
        document.getElementById('round-label').textContent='Serie — / —  |  Versuch — / —';
        state='preview';
        // Show real track for 3s
        isWarmup=false;
        drawScene(0,mouseY,false,null);
        // overlay "Parcours" text
        ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,CW,CH);
        ctx.fillStyle='#1D9E75';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('Eingewöhnung abgeschlossen!',CW/2,CH/2-18);
        ctx.fillStyle='white';ctx.font='13px sans-serif';
        ctx.fillText('Parcours einprägen – Experiment startet in 3 Sek.',CW/2,CH/2+12);
        let previewCount=3;
        const previewTimer=setInterval(()=>{
          previewCount--;
          if(previewCount<=0){
            clearInterval(previewTimer);
            state='ready';
            drawScene(0,mouseY,false,'start');
            document.getElementById('msg').textContent='Bereit! Tippen oder Leertaste → Start';
          } else {
            drawScene(0,mouseY,false,null);
            ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,CW,CH);
            ctx.fillStyle='#1D9E75';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
            ctx.fillText('Eingewöhnung abgeschlossen!',CW/2,CH/2-18);
            ctx.fillStyle='white';ctx.font='13px sans-serif';
            ctx.fillText('Parcours einprägen – Experiment startet in '+previewCount+' Sek.',CW/2,CH/2+12);
          }
        },1000);
      } else {
        startCountdown(false);
      }
    } else {
      const repsDone=currentRep>=REPS(),seriesDone=repsDone&&currentSeries>=SERIES();
      if(seriesDone){state='done';drawScene(PATH_END-10,mouseY,false,null);document.getElementById('msg').textContent='Experiment abgeschlossen! Siehst du eine Lernkurve?';document.getElementById('round-label').textContent='Fertig';}
      else if(repsDone){seriesScores=[];startCountdown(true);}
      else{startCountdown(false);}
    }
  },2000);
}
function startCountdown(isSeriesPause){
  state='countdown';
  const total=isSeriesPause?SERIES_DELAY():DELAY();let remaining=total;
  document.getElementById('msg').textContent=(isSeriesPause?'Serienpause':'Nächster Versuch')+' in '+remaining+' Sek.';
  drawScene(PATH_END-10,mouseY,false,'countdown',remaining,null,isSeriesPause);
  countdownId=setInterval(()=>{
    remaining--;
    if(remaining<=0){clearInterval(countdownId);triggerStart();}
    else{
      drawScene(PATH_END-10,mouseY,false,'countdown',remaining,null,isSeriesPause);
      document.getElementById('msg').textContent=(isSeriesPause?'Serienpause':'Nächster Versuch')+' in '+remaining+' Sek.';
    }
  },1000);
  // Animate cursor dot at 30fps during countdown
  function animateCursor(){
    if(state!=='countdown') return;
    drawScene(PATH_END-10,mouseY,false,'countdown',remaining,null,isSeriesPause);
    requestAnimationFrame(animateCursor);
  }
  requestAnimationFrame(animateCursor);
}
function triggerStart(){
  if(state==='done'||state==='preview')return;
  if(state==='countdown')clearInterval(countdownId);
  if(state==='idle'||state==='ready'||state==='countdown'){
    if(state==='idle'){
      isWarmup=true;warmupRep=1;currentSeries=0;currentRep=0;
    } else if(isWarmup){
      warmupRep++;
    } else {
      currentRep++;if(currentRep>REPS()){currentSeries++;currentRep=1;}
    }
    if(!isWarmup&&state==='ready'){
      // transition from warmup to real: start first rep
      currentSeries=1;currentRep=1;
    }
    cancelAnimationFrame(animId);
    finished=false;dotX=0;onTrackFrames=0;totalFrames=0;lastTs=null;trail=[];
    if(controlMode==='touch'){
      mouseY=activePlatforms()[0][2];
    } else {
      // Sync Punkt auf tatsächliche Canvas-relative Mausposition
      const r=cv.getBoundingClientRect();
      const canvasRelY=(mouseAbsY-r.top)*CH/r.height;
      mouseY=Math.max(5,Math.min(CH-5,canvasRelY));
    }
    updateLabel();
    document.getElementById('msg').textContent='Steuere den Punkt mit Maus oder Finger!';
    state='running';
    document.body.style.cursor='none';
    animId=requestAnimationFrame(loop);
  }
}
function drawChart(){
  const lc=document.getElementById('lc');
  lc.width=lc.parentElement.clientWidth-32;lc.height=150;
  const c=lc.getContext('2d'),w=lc.width,h=lc.height;
  const padL=38,padR=12,padT=12,padB=20;
  c.clearRect(0,0,w,h);c.fillStyle='#1e1e1e';c.fillRect(0,0,w,h);
  if(!allScores.length){c.fillStyle='#555';c.font='13px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('Lernkurve erscheint nach dem ersten Versuch',w/2,h/2);return;}
  const total=SERIES()*REPS();
  const minV=Math.max(0,Math.min(...allScores)-10),maxV=Math.min(100,Math.max(...allScores)+10);
  const xs=i=>padL+i*(w-padL-padR)/Math.max(total-1,1);
  const ys=v=>padT+(1-(v-minV)/(maxV-minV))*(h-padT-padB);
  // Y axis
  c.strokeStyle='#444';c.lineWidth=1;
  c.beginPath();c.moveTo(padL,padT);c.lineTo(padL,h-padB);c.stroke();
  // Y ticks
  const step=Math.ceil((maxV-minV)/4/5)*5;
  for(let v=Math.ceil(minV/step)*step;v<=maxV;v+=step){
    const y=ys(v);
    c.beginPath();c.strokeStyle='#333';c.lineWidth=0.5;
    c.moveTo(padL,y);c.lineTo(w-padR,y);c.stroke();
    c.fillStyle='#888';c.font='10px sans-serif';c.textAlign='right';c.textBaseline='middle';
    c.fillText(v+'%',padL-4,y);
  }
  // Y axis label
  c.save();c.translate(10,h/2);c.rotate(-Math.PI/2);
  c.fillStyle='#666';c.font='10px sans-serif';c.textAlign='center';c.textBaseline='middle';
  c.fillText('% auf Pfad',0,0);c.restore();
  // Series dividers + mean per series
  for(let s=1;s<=SERIES();s++){
    const start=(s-1)*REPS(), end=Math.min(s*REPS(),allScores.length);
    if(end<=start) continue;
    const slice=allScores.slice(start,end);
    const mean=Math.round(slice.reduce((a,b)=>a+b,0)/slice.length);
    const x0=xs(start), x1=xs(end-1), mx=(x0+x1)/2;
    // mean line
    c.beginPath();c.strokeStyle='rgba(255,200,50,0.35)';c.lineWidth=1;c.setLineDash([3,3]);
    c.moveTo(x0,ys(mean));c.lineTo(x1,ys(mean));c.stroke();c.setLineDash([]);
    // best value
    const best=Math.max(...slice);
    // divider between series
    if(s<SERIES()&&end<allScores.length){
      const xi=xs(end-1)+(xs(end)-xs(end-1))/2;
      c.beginPath();c.strokeStyle='#554';c.lineWidth=1;c.setLineDash([4,4]);
      c.moveTo(xi,padT);c.lineTo(xi,h-padB);c.stroke();c.setLineDash([]);
      c.fillStyle='#664';c.font='9px sans-serif';c.textAlign='center';c.textBaseline='top';
      c.fillText('S'+s,xi,padT+2);
    }
  }
  allScores.forEach((_,i)=>{c.fillStyle='#888';c.font='10px sans-serif';c.textAlign='center';c.textBaseline='bottom';c.fillText(i+1,xs(i),h-2);});
  // update table
  const tbody=document.getElementById('series-tbody');
  tbody.innerHTML='';
  let hasData=false;
  for(let s=1;s<=SERIES();s++){
    const start=(s-1)*REPS(),end=Math.min(s*REPS(),allScores.length);
    if(end<=start) break;
    hasData=true;
    const slice=allScores.slice(start,end);
    const mean=Math.round(slice.reduce((a,b)=>a+b,0)/slice.length);
    const best=Math.max(...slice);
    const tr=document.createElement('tr');
    tr.style.background=s%2===0?'#1a1a2e':'#1e1e2e';
    tr.innerHTML=`<td style="padding:5px 10px;border:1px solid #333;color:#eee;">Serie ${s}</td>
      <td style="padding:5px 10px;border:1px solid #333;text-align:center;color:#e8c040;font-weight:500;">${mean}%</td>
      <td style="padding:5px 10px;border:1px solid #333;text-align:center;color:#7dd;font-weight:500;">${best}%</td>`;
    tbody.appendChild(tr);
  }
  document.getElementById('table-wrap').style.display=hasData?'block':'none';
  c.beginPath();c.strokeStyle='#1D9E75';c.lineWidth=2;
  allScores.forEach((v,i)=>i===0?c.moveTo(xs(i),ys(v)):c.lineTo(xs(i),ys(v)));c.stroke();
  allScores.forEach((v,i)=>{c.beginPath();c.fillStyle='#1D9E75';c.arc(xs(i),ys(v),4,0,2*Math.PI);c.fill();});
}
function setMode(mode){
  controlMode=mode;
  ['mouse','touch'].forEach(m=>{
    const b=document.getElementById('btn-'+m);
    b.style.borderColor=m===mode?'#378ADD':'#555';
    b.style.color=m===mode?'#378ADD':'#eee';
    b.style.background=m===mode?'#1a2a3a':'#222';
  });
}
function onMouseMove(e){
  const dy=e.clientY-mouseAbsY;
  mouseAbsY=e.clientY;
  if(controlMode==='mouse'){
    mouseY=Math.max(5,Math.min(CH-5,mouseY+dy));
    if(!mouseInCanvas&&state!=='running') mouseInCanvas=true;
    // Redraw so green cursor dot updates when idle/ready
    if(state==='idle'||state==='ready'){
      drawScene(0,mouseY,false,'start');
    }
  }
}
function onTouchMove(e){
  e.preventDefault();
  if(controlMode==='touch'){
    const r=cv.getBoundingClientRect();
    const absY=(e.touches[0].clientY-r.top)*CH/r.height;
    if(state==='running')mouseY=Math.max(5,Math.min(CH-5,absY));
  } else {
    const dy=e.touches[0].clientY-mouseAbsY;mouseAbsY=e.touches[0].clientY;
    if(state==='running'){mouseY=Math.max(5,Math.min(CH-5,mouseY+dy));}
  }
}
function resetExp(){
  clearInterval(countdownId);cancelAnimationFrame(animId);
  state='idle';isWarmup=true;warmupRep=0;currentSeries=0;currentRep=0;finished=false;
  dotX=0;mouseY=WARMUP_PLATFORMS[0][2];allScores=[];seriesScores=[];
  onTrackFrames=0;totalFrames=0;lastTs=null;trail=[];
  document.getElementById('round-label').textContent='Serie — / —  |  Versuch — / —';
  document.getElementById('msg').textContent='Tippen oder Leertaste → Start';
  document.getElementById('table-wrap').style.display='none';
  document.getElementById('series-tbody').innerHTML='';
  drawScene(0,PLATFORMS[0][2],false,'start');drawChart();
}
window.addEventListener('load',init);
window.addEventListener('mousemove',onMouseMove);
document.getElementById('track-wrap').addEventListener('mouseenter',()=>{mouseInCanvas=true;});
document.getElementById('track-wrap').addEventListener('mouseleave',()=>{mouseInCanvas=false;});
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();triggerStart();}});
const wrap=document.getElementById('track-wrap');
wrap.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button===0) triggerStart();
});
wrap.addEventListener('touchstart',e=>{
  e.preventDefault();
  e.stopPropagation();
  mouseAbsY=e.touches[0].clientY;
  if(state==='idle'||state==='ready') triggerStart();
},{passive:false});
wrap.addEventListener('touchmove',onTouchMove,{passive:false});
// Stop all touch events on settings and controls from bubbling
document.getElementById('controls').addEventListener('touchstart',e=>e.stopPropagation(),{passive:false});
</script>
